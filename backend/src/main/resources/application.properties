# =========================
# MySQL Datasource
# =========================
# Reads from real environment variables in production (set by your hosting
# platform). No secret defaults are baked in here — set these in Render's
# Environment tab.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/farmxchain_auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# Hibernate / JPA
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# =========================
# HikariCP Connection Pool
# =========================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=FarmXChainHikari

# =========================
# Cloudinary
# =========================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# =========================
# Gemini API
# =========================
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-flash-latest

# =========================
# Server
# =========================
# Render (and most cloud hosts) inject the actual port via the PORT env var -
# this must be respected, or the deployed app won't be reachable.
server.port=${PORT:8080}

# =========================
# Optional Logging (kept off by default; uncomment to debug)
# =========================
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.springframework.security=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB

# =========================
# CORS - your deployed frontend's URL (e.g. https://your-app.vercel.app)
# =========================
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:3000}

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET:changemechangemechangemechangeme32}
